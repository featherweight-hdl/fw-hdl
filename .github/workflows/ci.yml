name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install IVPM, restore its content-addressed cache, and run
      # `ivpm update` to populate ./packages (dv-flow-mgr, dv-flow-libhdlsim,
      # and the Verilator/Yosys EDA toolchains) from the default-dev dep-set.
      - name: Setup IVPM + dependencies
        uses: fvutils/ivpm-setup@v1
        with:
          dep-set: default-dev

      # The old front end lives on branch `legacy` (tag `legacy-fe-final`);
      # fail if any of it comes back.
      - name: Check for the legacy front end
        run: sh tools/check-no-legacy.sh

      # The EDA toolchains publish `export.envrc` files; the project-root
      # `.envrc` sources packages/packages.envrc to put dfm, Verilator and
      # Yosys on PATH. direnv activates that environment for `direnv exec`.
      - name: Enable direnv
        run: |
          sudo apt-get update && sudo apt-get install -y direnv
          direnv allow .

      # `fw-hdl.tests` runs every example's tests (pytest over examples/).
      # DFM_CORES keeps each Verilator build serial, so the runner's memory
      # holds when tests build in parallel.
      - name: Run the examples' tests
        env:
          DFM_CORES: 1
        run: direnv exec . dfm run tests
