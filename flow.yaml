# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
# fw-hdl, the umbrella project. Each example under examples/ is its own dfm
# package; `dfm run tests` here runs every example's tests (pytest's
# testpaths, see pyproject.toml).
package:
  name: fw-hdl

  tasks:
  - name: tests
    desc: The examples' tests (examples/*/test_*.py)
    # A test run with no inputs for dv-flow to hash: never "up to date".
    uptodate: false
    run: cd ${{ srcdir }} && python -m pytest -q -p no:cacheprovider examples
