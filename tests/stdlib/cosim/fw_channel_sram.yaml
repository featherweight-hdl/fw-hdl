# Cosim of fw_channel bound to a RAM (knob `storage: {bind: sram}`):
# fw_sram_fifo and its RAM model, 4 deep, against the class's contract and
# rules, beside fw_rv_fifo at the same depth.
class: fw_channel
params: {W: 8, DEPTH: 4}
targets:
  - name: own
    module: fw_rv_fifo
    files: [../../../src/rtl/fw_rv_fifo.sv]
    params: {WIDTH: 8, DEPTH: 4}
    ports:
      put_ex: {data: in_data, valid: in_vld, ready: in_rdy}
      get_ex: {data: out_data, valid: out_vld, ready: out_rdy}
  - name: sram
    module: sram_fifo_sim
    files: [../../../src/rtl/fw_sram_fifo.sv, ../../../src/rtl/fw_ram_1r1w_model.sv,
            sram_fifo_sim.sv]
    params: {WIDTH: 8, DEPTH: 4}
    ports:
      put_ex: {data: in_data, valid: in_vld, ready: in_rdy}
      get_ex: {data: out_data, valid: out_vld, ready: out_rdy}
