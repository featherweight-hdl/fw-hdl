# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
fragment:
  name: rv_proto

  tasks:
  # The ready/valid kit (src/std/rv) at its default 32-bit payload: a driver,
  # sink and observer over the initiator, target and monitor transactors.
  # tests/rv_proto/test_rv_kit.py also runs it at 8 bits and at a struct type.
  - name: rv-proto-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include:
      - rv_proto_pkg.sv
      - rv_proto_tb.sv
      incdirs:
      - .

  - name: rv-proto-img
    uses: hdlsim.vlt.SimImage
    needs: [hdl.sv-src, hdl.rv-src, rv-proto-tb]
    with:
      top: [rv_proto_tb]

  - name: rv-proto
    uses: hdlsim.vlt.SimRun
    needs: [rv-proto-img]
