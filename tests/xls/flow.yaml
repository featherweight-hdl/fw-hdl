# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
fragment:
  name: xls

  tasks:
  # XLS back end. The SV static subset runs on
  # Verilator (the normative reference) and, through the static front end and
  # zuspec-be-xls, in our XLS IR interpreter; the results must match. Also runs
  # the be-xls unit tests. Both suites are pytest; this task runs them so that
  # `dfm run tests` gates them. With opt_main on PATH (or $XLS_BIN set) they also
  # check the IR against XLS itself.
  - name: xls-conformance
    desc: XLS back-end conformance -- the static subset on Verilator vs the emitted XLS IR, plus the be-xls unit tests
    # A test run, not a build artifact: it has no inputs for dv-flow to hash,
    # so without this it would be reported up to date after the first run.
    uptodate: false
    #
    # `python` is the environment's (dfm's PATH), not packages/python/bin: in a
    # project that has fw-hdl as a package there is no fw-hdl/packages. The
    # be-xls tests are run from where zuspec-be-xls is installed (an editable
    # ivpm checkout has its tests/ beside src/). `bigmem` tests (tens of GB) are
    # left out; tests/xls/conftest.py also skips them unless FW_HDL_RUN_BIGMEM.
    run: >-
      cd ${{ srcdir }}/../.. &&
      BEXLS=$(python -c 'import pathlib, zuspec.be.xls as m; print(pathlib.Path(m.__file__).resolve().parents[4] / "tests")') &&
      if [ ! -d "$BEXLS" ]; then echo "zuspec-be-xls tests not found ($BEXLS)" >&2; exit 1; fi &&
      python -m pytest -q -p no:cacheprovider -m "not bigmem" tests/xls "$BEXLS"
