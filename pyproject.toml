[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# fw-hdl is the umbrella project: it pulls the canonical packages together
# (fw-hdl-spec, fw-hdl-fe-sv, fw-hdl-rt-sv, fw-hdl-dv, via ivpm.yaml) and holds
# the examples. It has no Python code of its own yet. `fw` and `fw.hdl` are
# namespace packages shared with the canonical packages, so never add an
# `fw/hdl/__init__.py` here.
[project]
name = "fw-hdl"
version = "0.0.1"
description = "Featherweight-HDL umbrella: the canonical packages and their examples"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "fw-hdl-fe-sv",
    "fw-hdl-rt-sv",
]

[project.optional-dependencies]
# The examples' tests drive dfm flows and Verilator/cocotb sims.
test = [
    "pytest>=7.0",
    "pytest-dfm",
    "dv-flow-mgr",
    "dv-flow-libhdlsim",
    "cocotb",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["examples"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# cocotb's own test modules (examples/*/cocotb/test_*.py) run under cocotb,
# not pytest.
norecursedirs = [".*", "build", "dist", "*.egg", "cocotb", "rundir", "obj_dir"]
markers = ["verilator: builds and runs a Verilator simulation"]
