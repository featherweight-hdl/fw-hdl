# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
# rr_merge with a map on each side: the micro-pipelining feasibility vehicle
# (see README.md and docs/design/micro-pipelining-feasibility.md).
#
#   dfm run sim       the classes (v0, W = 8, N = 4) on tb/pipe_bench.sv
#
# The generated RTL and the hand-written variants run on the same bench from
# scripts/run_rtl.sh (one Verilator build per module x W x N).
package:
  name: rr_merge_pipe

  tasks:
  # fw-hdl's kernel package: woven along with the design, since the weavers
  # read its port classes.
  - name: fw-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../../src
      include: [fw_clock_xtor_if.sv, fw_clock_period_xtor_if.sv, fw_hdl_pkg.sv]
      incdirs: [.]

  - name: fw-mods
    uses: std.FileSet
    needs: [woven]
    with:
      type: systemVerilogSource
      base: ../../src
      include: [fw_clock_period_xtor.sv, fw_root.sv, fw_rv_pin_in.sv, fw_rv_pin_out.sv]

  - name: src
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: src
      include: [pipe_types_pkg.sv, rr_merge_pipe_pkg.sv]
      incdirs: [., ../../rr_merge/src]

  - name: woven
    uses: svweave.Weave
    needs: [fw-pkg, src]
    with:
      config: sv-weave.yaml

  - name: tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: tb
      include: [pipe_bench.sv, pipe_cls_tb.sv]

  - name: sim-img
    uses: hdlsim.vlt.SimImage
    needs: [woven, fw-mods, tb]
    with:
      top: [pipe_cls_tb]

  - root: sim
    uses: hdlsim.vlt.SimRun
    needs: [sim-img]
    with:
      plusargs: [sink=1]
