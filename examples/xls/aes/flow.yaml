# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
# E10, aes: AES-128/256 key schedule, encrypt and decrypt as functions over u8[4][4] blocks; the S-boxes as constant tables.
# The same graph as crc32/flow.yaml (the template example, which comments
# every step). Tests run through ../flow.yaml's img/run families.
fragment:
  name: aes

  tasks:
  # ---- Sources --------------------------------------------------------
  - name: orig
    desc: The upstream DSLX, unmodified (orig/UPSTREAM)
    uses: std.FileSet
    with:
      type: dslxSource
      base: orig
      include: [xls/modules/aes/constants.x, xls/modules/aes/aes_common.x, xls/modules/aes/aes.x, xls/modules/aes/aes_ctr.x]

  - name: src
    desc: The SV port
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include: [aes_pkg.sv]

  - name: unit-tests
    desc: The upstream tests as SVUnit tests, calling the API
    uses: std.FileSet
    with:
      type: svunitTest
      include: [aes_unit_test.sv]

  # ---- The SV path ----------------------------------------------------
  - name: ir
    uses: fw.hdl.xls.IR
    needs: [src]
    with:
      top: [aes_pkg::create_key_schedule, aes_pkg::encrypt, aes_pkg::decrypt]

  - name: rtl
    uses: synth.xls.Codegen
    needs: [ir]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  # ---- The DSLX path --------------------------------------------------
  - name: dslx-test
    uses: synth.xls.DslxTest
    needs: [orig]

  - name: dslx-ir
    uses: synth.xls.DslxToIR
    needs: [orig]
    with:
      tops: [create_key_schedule, encrypt, decrypt]

  - name: dslx-rtl
    uses: synth.xls.Codegen
    needs: [dslx-ir]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  - name: equiv
    desc: Each SV function's optimized IR against its DSLX original's
    uses: synth.xls.Equiv
    needs: [rtl, dslx-rtl]
    with:
      # A minute for the solver; a function whose inputs total 20 bits or
      # fewer is then compared on every input instead.
      timeout_s: 60
      pairs: [aes_pkg__create_key_schedule=__aes__create_key_schedule, aes_pkg__encrypt=__aes__encrypt, aes_pkg__decrypt=__aes__decrypt]

  # ---- Yosys ----------------------------------------------------------
  # Yosys reads XLS's Verilog-2001 for AES: its SV (arrays of arrays) needs
  # sv2v, and that takes three times the memory (14.7 GB against 4.9 GB for
  # encrypt). Same IR, same module and ports; the SV is what `rtl` runs.
  - name: rtl-v2001
    uses: synth.xls.Codegen
    needs: [ir]
    with:
      pipeline_stages: 2
      system_verilog: false
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  - name: dslx-rtl-v2001
    uses: synth.xls.Codegen
    needs: [dslx-ir]
    with:
      pipeline_stages: 2
      system_verilog: false
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  - name: synth
    strategy:
      select:
        axes:
          target: [generic, ice40, ecp5]
      body:
      - uses: synth.yosys.Synth
        needs: [rtl-v2001]
        with:
          target: "${{ this.target }}"

  - name: dslx-synth
    strategy:
      select:
        axes:
          target: [generic, ice40, ecp5]
      body:
      - uses: synth.yosys.Synth
        needs: [dslx-rtl-v2001]
        with:
          target: "${{ this.target }}"

  # ---- The API, and what answers it at each level ---------------------
  - name: api
    uses: fw.hdl.api.Functions
    needs: [src]
    with:
      functions: [aes_pkg::create_key_schedule, aes_pkg::encrypt, aes_pkg::decrypt]

  - name: dut-model
    uses: fw.hdl.api.ModelBinding
    needs: [api]

  - name: bind-xls
    uses: fw.hdl.api.XlsBinding
    needs: [api, rtl]

  - name: runner
    uses: hdltest.svunit.TestRunner
    needs: [unit-tests]
    with:
      harness: [aes_pkg_api_harness]
  - name: bench-model
    passthrough: all
    needs: [src, api, dut-model, runner]
  - name: bench-rtl
    passthrough: all
    needs: [src, api, rtl, bind-xls, runner]
  - name: bench-gates
    passthrough: all
    needs: [src, api, synth.generic, bind-xls, runner]
  - name: bench-gates-ice40
    passthrough: all
    needs: [src, api, synth.ice40, bind-xls, runner]
  - name: bench-gates-ecp5
    passthrough: all
    needs: [src, api, synth.ecp5, bind-xls, runner]
  # ---- The tests ------------------------------------------------------
  - name: test
    strategy:
      matrix:
        view: [model, rtl, gates, gates-ice40, gates-ecp5]
        case:
        - {name: aes}
      body:
      - name: "${{ this.view }}-${{ this.case.name }}"
        uses: hdltest.svunit.Check
        needs: ["xls_examples.run.aes.${{ this.view }}"]
        with:
          name: "aes-${{ this.view }}"
        tags:
        - std.Test: {case: "${{ this.case.name }}", view: "${{ this.view }}"}

  - root: all
    desc: "aes end to end: both paths, equivalence, Yosys on both, the tests at every level"
    needs:
    - dslx-test
    - equiv
    - synth.generic
    - synth.ice40
    - synth.ecp5
    - dslx-synth.generic
    - dslx-synth.ice40
    - dslx-synth.ecp5
    - test
