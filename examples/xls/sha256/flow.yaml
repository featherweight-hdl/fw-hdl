# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
# E8, sha256: one SHA-256 chunk as one function (64 rounds unrolled); a tuple as a packed struct.
# The same graph as crc32/flow.yaml (the template example, which comments
# every step). Tests run through ../flow.yaml's img/run families.
fragment:
  name: sha256

  tasks:
  # ---- Sources --------------------------------------------------------
  - name: orig
    desc: The upstream DSLX, unmodified (orig/UPSTREAM)
    uses: std.FileSet
    with:
      type: dslxSource
      base: orig
      include: [xls/examples/sha256.x]

  - name: std-pkg
    desc: "SV ports of the DSLX std:: functions the examples call"
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../common
      include: [xls_std_pkg.sv]

  - name: src
    desc: The SV port
    uses: std.FileSet
    needs: [std-pkg]
    with:
      type: systemVerilogSource
      include: [sha256_pkg.sv]

  - name: dslx-top
    desc: The DSLX tops (not upstream; see dslx_top/)
    uses: std.FileSet
    with:
      type: dslxSource
      base: dslx_top
      include: ["*.x"]

  - name: unit-tests
    desc: The upstream tests as SVUnit tests, calling the API
    uses: std.FileSet
    with:
      type: svunitTest
      include: [sha256_unit_test.sv]

  # ---- The SV path ----------------------------------------------------
  - name: ir
    uses: fw.hdl.xls.IR
    needs: [src]
    with:
      top: [sha256_pkg::sha256, sha256_pkg::compute_pad_bits]

  - name: rtl
    uses: synth.xls.Codegen
    needs: [ir]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  # ---- The DSLX path --------------------------------------------------
  - name: dslx-test
    uses: synth.xls.DslxTest
    needs: [orig]

  - name: dslx-ir
    uses: synth.xls.DslxToIR
    needs: [dslx-top, orig]
    with:
      tops: [sha256_flat, compute_pad_bits]

  - name: dslx-rtl
    uses: synth.xls.Codegen
    needs: [dslx-ir]
    with:
      pipeline_stages: 2
      input_valid_signal: input_valid
      output_valid_signal: output_valid

  - name: equiv
    desc: Each SV function's optimized IR against its DSLX original's (sha256 through dslx_top/, which flattens the Digest tuple)
    uses: synth.xls.Equiv
    needs: [rtl, dslx-rtl]
    with:
      # A minute for the solver; a function whose inputs total 20 bits or
      # fewer is then compared on every input instead.
      timeout_s: 60
      pairs: [sha256_pkg__sha256=__sha256_tops__sha256_flat, sha256_pkg__compute_pad_bits=__sha256__compute_pad_bits]

  # ---- Yosys ----------------------------------------------------------
  - name: synth
    strategy:
      select:
        axes:
          target: [generic, ice40, ecp5]
      body:
      - uses: synth.yosys.Synth
        needs: [rtl]
        with:
          target: "${{ this.target }}"

  - name: dslx-synth
    strategy:
      select:
        axes:
          target: [generic, ice40, ecp5]
      body:
      - uses: synth.yosys.Synth
        needs: [dslx-rtl]
        with:
          target: "${{ this.target }}"

  # ---- The API, and what answers it at each level ---------------------
  - name: api
    uses: fw.hdl.api.Functions
    needs: [src]
    with:
      functions: [sha256_pkg::sha256, sha256_pkg::compute_pad_bits]

  - name: dut-model
    uses: fw.hdl.api.ModelBinding
    needs: [api]

  - name: bind-xls
    uses: fw.hdl.api.XlsBinding
    needs: [api, rtl]

  - name: runner
    uses: hdltest.svunit.TestRunner
    needs: [unit-tests]
    with:
      harness: [sha256_pkg_api_harness]
  - name: bench-model
    passthrough: all
    needs: [src, api, dut-model, runner]
  - name: bench-rtl
    passthrough: all
    needs: [src, api, rtl, bind-xls, runner]
  - name: bench-gates
    passthrough: all
    needs: [src, api, synth.generic, bind-xls, runner]
  - name: bench-gates-ice40
    passthrough: all
    needs: [src, api, synth.ice40, bind-xls, runner]
  - name: bench-gates-ecp5
    passthrough: all
    needs: [src, api, synth.ecp5, bind-xls, runner]
  # ---- The tests ------------------------------------------------------
  - name: test
    strategy:
      matrix:
        view: [model, rtl, gates, gates-ice40, gates-ecp5]
        case:
        - {name: sha256}
      body:
      - name: "${{ this.view }}-${{ this.case.name }}"
        uses: hdltest.svunit.Check
        needs: ["xls_examples.run.sha256.${{ this.view }}"]
        with:
          name: "sha256-${{ this.view }}"
        tags:
        - std.Test: {case: "${{ this.case.name }}", view: "${{ this.view }}"}

  - root: all
    desc: "sha256 end to end: both paths, equivalence, Yosys on both, the tests at every level"
    needs:
    - dslx-test
    - equiv
    - synth.generic
    - synth.ice40
    - synth.ecp5
    - dslx-synth.generic
    - dslx-synth.ice40
    - dslx-synth.ecp5
    - test
