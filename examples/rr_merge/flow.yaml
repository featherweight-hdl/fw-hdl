# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
# Round-robin stream merger: an fw-hdl sync-logic example (see README.md).
#
#   dfm run sim
#
# weaves rr_merge_pkg with fw-hdl's sv-weave weavers, builds the pin-level
# testbench with Verilator and runs it (+fw_settle_show prints the settle
# schedule the weave produced).
package:
  name: rr_merge

  tasks:
  # fw-hdl's kernel package: woven along with the design, since the weavers
  # read its port classes.
  - name: fw-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../../src
      include: [fw_clock_xtor_if.sv, fw_clock_period_xtor_if.sv, fw_hdl_pkg.sv]
      incdirs: [.]

  # fw-hdl's modules: not woven (fw_root does not elaborate on its own,
  # without a Tbind).
  - name: fw-mods
    uses: std.FileSet
    needs: [woven]
    with:
      type: systemVerilogSource
      base: ../../src
      include: [fw_clock_period_xtor.sv, fw_root.sv, fw_rv_pin_in.sv, fw_rv_pin_out.sv]

  - name: src
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: src
      include: [rr_merge_pkg.sv]
      incdirs: [.]

  - name: woven
    uses: svweave.Weave
    needs: [fw-pkg, src]
    with:
      config: sv-weave.yaml

  - name: tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: tb
      include: [rr_merge_tb.sv]

  - name: sim-img
    uses: hdlsim.vlt.SimImage
    needs: [woven, fw-mods, tb]
    with:
      top: [rr_merge_tb]

  - root: sim
    uses: hdlsim.vlt.SimRun
    needs: [sim-img]
    with:
      plusargs: [fw_settle_show]

  # Hand-written reference RTL (LOWERING.md L1) and its module testbench:
  #
  #   dfm run ref-sim
  - name: ref-rtl
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: rtl
      include: [rr_merge_ref.sv]

  - name: ref-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: tb
      include: [rr_merge_ref_tb.sv]

  - name: ref-sim-img
    uses: hdlsim.vlt.SimImage
    needs: [ref-rtl, ref-tb]
    with:
      top: [rr_merge_ref_tb]

  - root: ref-sim
    uses: hdlsim.vlt.SimRun
    needs: [ref-sim-img]

  # The RTL generated from the classes (scripts/gen_rtl.py writes
  # rtl/gen/rr_merge.sv), run by the module testbench in lockstep with the
  # reference.
  - name: gen-rtl
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: rtl/gen
      include: [rr_merge.sv]
      defines: [RR_MERGE_GEN]

  - name: gen-sim-img
    uses: hdlsim.vlt.SimImage
    needs: [ref-rtl, gen-rtl, ref-tb]
    with:
      top: [rr_merge_ref_tb]

  - root: gen-sim
    uses: hdlsim.vlt.SimRun
    needs: [gen-sim-img]
