# Docs build for featherweight-hdl/fw-hdl on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. dvkit.org owns all
# documentation for the estate: this repo's docs land at
# dvkit.org/featherweight-hdl/fw-hdl/. dvkit.org is a single Cloudflare Pages
# project and a deploy replaces the WHOLE site, so there is exactly one
# publisher for it, and it is not this job.
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token and mounts nothing. Everything after the upload is
# host-side: a successful run on `main` is fetched, auto-promoted and deployed
# within about ten seconds. Other branches stay staged for review.
#
# Auto-promote means no human stands between a push to main and the live site,
# so the sanity checks below stand in for that review. Keep them honest.
#
# Constraints this file is shaped by (measured on this instance):
#  1. No third-party actions: a bare `uses:` resolves against code.forgejo.org,
#     so there is no actions/setup-python. `ubuntu-latest` is
#     catthehacker/ubuntu:act-22.04, with Python 3.10 -- the floor
#     docs/requirements.txt is written for.
#  2. `python` unqualified does not exist there. Use python3.
#  3. The docs need no EDA tools, so this job does NOT run `ivpm update`
#     (which fetches Verilator, Yosys and nextpnr). It installs
#     docs/requirements.txt into a fresh venv. ivpm.yaml carries the same
#     packages for the development environment.
#  4. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP root --
#     docs-fetch refuses an artifact with no index.html at the top level.
#
# Trial-run on 2026-10-04 in catthehacker/ubuntu:act-22.04 from a clean
# `git archive`: Sphinx 8.1.3, MyST 4.0.1, -W clean, 98 HTML pages.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. The pathspec excludes the whole
        # .forgejo/workflows directory: each workflow carries a copy of this
        # pattern, and excluding only itself would match the other's.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Install Graphviz
        # sphinx-systemverilog and sphinx-dv-flow draw diagrams with `dot`.
        # Without it they warn, and -W turns the warning into a failure.
        run: |
          apt-get update -qq
          apt-get install -y -qq graphviz
          dot -V

      - name: Install the docs toolchain
        run: |
          echo "python: $(python3 -V 2>&1)"
          python3 -m venv /tmp/docsenv
          /tmp/docsenv/bin/pip install -q --upgrade pip
          /tmp/docsenv/bin/pip install -q -r docs/requirements.txt
          /tmp/docsenv/bin/python -c "import sphinx, myst_parser; print('sphinx', sphinx.__version__, 'myst', myst_parser.__version__)"

      - name: Build HTML docs
        # -W: a warning is an error. Most of what goes wrong in this doc set
        # (a reference that resolves nothing, a source that no longer parses)
        # surfaces only as a warning.
        run: |
          /tmp/docsenv/bin/sphinx-build -W -b html docs docs/_build/html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one because it deploys.
        run: |
          html=docs/_build/html
          test -s $html/index.html || { echo "::error::no index.html"; exit 1; }

          n=$(find $html -name '*.html' | wc -l)
          echo "generated pages: $n"
          # A known-good build produced 98 pages on 2026-10-04. The floor leaves
          # room for normal edits and catches a section dropping out. RAISE IT
          # as pages are added; a floor that never moves is decoration.
          [ "$n" -ge 85 ] || { echo "::error::only $n pages; a known-good build produces 98"; exit 1; }

          # Generated reference renders a heading even when it resolved
          # nothing, so count rendered objects, not pages.
          objs() { grep -o 'class="sig sig-object' "$html/$1.html" | wc -l; }
          need() {  # page, minimum number of rendered SV objects
            c=$(objs "$1"); echo "$1: $c objects"
            [ "$c" -ge "$2" ] || { echo "::error::$1 rendered $c objects (expected >= $2)"; exit 1; }
          }
          need reference/components 40
          need reference/std 15
          need reference/clocking 5
          need reference/registers 10
          need reference/debug 20
          for ex in crc32 adler32 lfsr gcd prefix_sum fir_dot idct_chen sha256 rle aes aes_ctr; do
            need examples/xls/$ex 1
          done

          # The flow-task reference (sphinx-dv-flow).
          for t in fw.hdl.xls.IR fw.hdl.api.Functions fw.hdl.api.Components \
                   fw.hdl.api.ModelBinding fw.hdl.api.XlsBinding \
                   fw.hdl.spl.Partition fw.hdl.spl.Integrate; do
            grep -q "$t" $html/reference/tasks.html \
              || { echo "::error::task $t missing from reference/tasks.html"; exit 1; }
          done
          echo "OK: $n pages; reference and examples rendered"

      - name: Upload docs
        # Consumed by the host-side poller: docs-fetch featherweight-hdl/fw-hdl main
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-featherweight-hdl-fw-hdl
          path: docs/_build/html/**
          if-no-files-found: error
