package:
  name: fw-hdl
  with:
    agents:
      claude: true
  default-dep-set: default-dev

  dep-sets:
  - name: use
    deps: []
  - name: default
    uses: dev

  - name: dev
    uses: use
    deps:
    - name: fw-hdl-spec
      url: https://github.com/featherweight-hdl/fw-hdl-spec.git
    - name: fw-hdl-fe-sv
      url: https://github.com/featherweight-hdl/fw-hdl-fe-sv.git
      dep-set: default
    - name: fw-hdl-rt-sv
      url: https://github.com/featherweight-hdl/fw-hdl-rt-sv.git
      dep-set: default
    - name: fw-hdl-dv
      url: https://github.com/featherweight-hdl/fw-hdl-dv.git

  - name: default-dev
    uses: dev
    deps: 
    - name: verilator
      url: https://github.com/edapack/verilator-bin
      src: gh-rls
      cache: true
    - name: yosys
      url: https://github.com/edapack/yosys-bin
      src: gh-rls
      cache: true
      dep-set: default
    - name: nextpnr
      url: https://github.com/edapack/nextpnr-bin
      src: gh-rls
      cache: true
    - name: sv-weave
      url: https://github.com/sv-weave/sv-weave.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    # FPGA back end: place and route, packing, programming.
    - name: dv-flow-libfpga
      url: https://github.com/dv-flow/dv-flow-libfpga.git
    # SVUnit tests as dv-flow tasks (hdltest.svunit); brings SVUnit itself
    # into packages/svunit.
    - name: dv-flow-libhdltest
      url: https://github.com/dv-flow/dv-flow-libhdltest.git
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    # cocotb bridges of generated transactors (docs/design/xtor-shell-plan.md
    # T7); cocotb 2.x needs Verilator >= 5.036.
    - name: cocotb
      src: pypi

    - name: zuspec-ir-core
      url: https://github.com/zuspec/zuspec-ir-core.git
    - name: zuspec-synth
      url: https://github.com/zuspec/zuspec-synth.git
    - name: zuspec-be-sw
      url: https://github.com/zuspec/zuspec-be-sw.git
    - name: zuspec-be-sv
      url: https://github.com/zuspec/zuspec-be-sv.git
    - name: zuspec-fe-sv
      url: https://github.com/zuspec/zuspec-fe-sv.git
    - name: zuspec-be-bc
      url: https://github.com/zuspec/zuspec-be-bc.git
    - name: pyslang
      src: pypi
